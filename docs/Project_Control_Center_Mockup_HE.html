 return panel('כלים מחוברים לפרויקט',o.links.map(i=>row(connections[i].n,connections[i].scope+' · '+connections[i].cap,button('פרטי חיבור','data-detail="connection:'+i+'"')+' '+sourceLink(connections[i].n))).join('')+row(k.name,k.account+' · '+k.mask,button('פרטי מפתח','data-detail="key:'+o.key+'"'))+button('ערוך חיבורים ומפתח','data-detail="projectEdit:'+p.id+'"'));
}
function costsPage(pid){
 const list=charges.map((c,i)=>({...c,i})).filter(c=>pid?c.p===pid:active(projectOf(c.p).space));
 const summary=list.reduce((acc,c)=>{acc.total+=c.cost;acc.tokens+=(c.input??0)+(c.output??0);return acc},{total:0,tokens:0});
 return facts([['תקופה','נובמבר 2026 · דמו'],['סך משויך (כולל אומדן)',usd(summary.total)],['טוקני AI מדווחים',qty(summary.tokens)],...(pid?[['תקציב חודשי',usd(offices[pid].budget)]]:[])])+
 panel('פירוט לפי שירות',list.map(c=>row(c.n,projectOf(c.p).name+' · '+c.type+' · '+(c.input===null?'תשתית':qty(c.input+c.output)+' טוקנים'),'<bdi>'+usd(c.cost)+'</bdi> '+button('פירוט חיוב','data-detail="cost:'+c.i+'"'))).join(''));
}
function agentList(pid){
 return panel('סוכנים',button('הגדר סוכן חדש','data-detail="agentNew:'+(pid||'general')+'"')+agents.map((a,i)=>({a,i})).filter(({a})=>pid?a.p===pid||(!a.p&&a.space===projectOf(pid).space):active(a.space)).map(({a,i})=>row(safe(a.name),(a.p?projectOf(a.p).name:'כללי במרחב')+' · '+(a.enabled?'פעיל':'מושהה'),button('הגדרה והפעלה','data-detail="agent:'+i+'"'))).join(''))+
 '<div class="details-panel">'+panel('היסטוריית ריצות',runs.map((r,i)=>({r,i})).filter(({r})=>pid?r.p===pid:active(projectOf(r.p).space)).reverse().map(({r,i})=>row(safe(r.name),projectOf(r.p).name+' · '+r.status,button('לתוצאה','data-detail="run:'+i+'"'))).join(''))+'</div>';
}
function officeDetail(kind,id){
 if(kind==='key'){
  const k=keys[id];
  return head(k.name,'זהות החיבור לספק AI')+facts([['חשבון ספק',k.account],['מזהה פנימי',k.ref],['תצוגה ממוסכת',k.mask],['גישה',k.scope]])+
   panel('משויך כעת',projects.filter(p=>offices[p.id].key===Number(id)).map(p=>row(p.name,'מפתח ברירת מחדל לפרויקט',button('לשינוי שיוך','data-detail="projectEdit:'+p.id+'"'))).join('')+agents.filter(a=>a.key===Number(id)).map(a=>row(safe(a.name),'מפתח סוכן','')).join(''));
 }
 if(kind==='cost'){
  const c=charges[id];
  return head(c.n,projectOf(c.p).name+' · פירוט עלות')+facts([['עלות',usd(c.cost)],['שיטת שיוך',c.type],['טוקני קלט',c.input===null?'לא רלוונטי':qty(c.input)],['טוקני פלט',c.output===null?'לא רלוונטי':qty(c.output)]])+
   panel('מקור החיוב','<p>נתוני דוגמה לחודש נובמבר. '+(c.key===undefined?'השיוך מתבסס על פרויקט ספק או על הקצאה מחשבון משותף.':'המפתח הבא מקושר לרשומת השימוש ההיסטורית.')+'</p>'+button('לפרויקט','data-project="'+c.p+'"')+(c.key===undefined?'':button('למפתח ששימש בחיוב','data-detail="key:'+c.key+'"')));
 }
 if(kind==='projectEdit'){
  const p=projectOf(id),o=offices[id];
  return head('עריכת '+p.name,'בחר כלי מקור, מפתח AI ותקציב חודשי')+panel('הגדרות פרויקט','<form class="edit" data-form="project" data-id="'+id+'"><label>מפתח ברירת מחדל<select name="key">'+keyOptions(p.space,o.key)+'</select></label><label>תקציב חודשי בדולר<input type="number" name="budget" min="0" step="0.01" required value="'+o.budget+'"></label><fieldset><legend>כלים המשויכים לפרויקט</legend>'+connections.map((c,i)=>c.space===p.space?'<div><label style="display:inline"><input style="width:auto" type="checkbox" name="links" value="'+i+'" '+(o.links.includes(i)?'checked':'')+'> '+c.n+' · '+c.scope+'</label></div>':'').join('')+'</fieldset><button class="action">שמור הגדרות</button></form>');
 }
 if(kind==='assetEdit'){
  const a=assets[id],space=projectOf(a.p)?.space??a.space;
  return head('שיוך נכס',a.n)+panel('פרויקט יעד','<form class="edit" data-form="asset" data-id="'+id+'"><label>שיוך לפרויקט<select name="project">'+option('','ממתין לשיוך',a.p??'')+projectsFor(space).map(p=>option(p.id,p.name,a.p)).join('')+'</select></label><button class="action">שמור שיוך</button></form>');
 }
 if(kind==='run'){
  const r=runs[id];
  return head('ריצת '+safe(r.name),projectOf(r.p).name+' · '+r.status)+facts([['מזהה ריצה',r.id],['טוקני קלט',r.input],['טוקני פלט',r.output],['עלות משוערת',usd(r.cost)]])+panel('תוצר הריצה','<p>'+safe(r.result)+'</p>'+button('למפתח ששימש בריצה','data-detail="key:'+r.key+'"')+' '+button('לפרויקט','data-project="'+r.p+'"'));
 }
 const isNew=kind==='agentNew',existing=agents[Number(id)];
 const initial=projectOf(id);
 const space=existing?.space??initial?.space??(state.space==='all'?'personal':state.space);
 const a=existing??{name:'',p:initial?.id??'',task:'',key:keys.findIndex(k=>k.space===space),enabled:true};
 const targetProjects=projectsFor(space).filter(p=>!a.p||p.id===a.p);
 return head(isNew?'סוכן חדש':safe(a.name),'הגדרה, שיוך והפעלה · '+(space==='comax'?'קומקס':'מרחב פרטי'))+
 panel('הגדרת סוכן','<form class="edit" data-form="agent" data-id="'+(isNew?'new':id)+'" data-space="'+space+'"><label>שם<input name="name" required maxlength="70" value="'+safe(a.name)+'"></label><label>שיוך<select name="project">'+option('','סוכן כללי במרחב',a.p)+projectsFor(space).map(p=>option(p.id,p.name,a.p)).join('')+'</select></label><label>הוראות משימה<textarea name="task" required maxlength="500">'+safe(a.task)+'</textarea></label><label>מפתח ספק<select name="key">'+keyOptions(space,a.key)+'</select></label><label style="display:block"><input style="width:auto" type="checkbox" name="enabled" '+(a.enabled?'checked':'')+'> פעיל</label><button class="action">שמור הגדרה</button></form>')+
 (isNew?'':'<div class="details-panel">'+panel('הפעלת דמו','<form class="edit" data-form="run" data-id="'+id+'"><label>פרויקט להרצה<select name="project">'+targetProjects.map(p=>option(p.id,p.name,a.p)).join('')+'</select></label><p>הפעלת הדמו תיצור תוצאה ורשומת שימוש. הפעולות מול הכלים הן לקריאה בדוגמה הזו.</p><button class="action" '+(a.enabled?'':'disabled')+'>הפעל סוכן</button></form>')+'</div>');
}
function detailPage(){
 const [kind,...parts]=state.detail.split(':');
 const id=parts.join(':');
 if(!['asset','event','connection'].includes(kind))return officeDetail(kind,id);
 if(kind==='asset'){
  const a=assets[Number(id)], [account,last,type,connection,events]=assetExtra[Number(id)];
  return head(a.n,a.d)+facts([['סוג',type],['חשבון מקור',account],['סביבה',a.e],['עדכון אחרון',last],['מצב',a.status]])+
   '<div class="evidence">'+(a.p?button('לפרויקט '+projectOf(a.p).name,'data-project="'+a.p+'"'):button('לתיבת המיון','data-page="inbox"'))+button('לפרטי החיבור','data-detail="connection:'+connection+'"')+' '+button('ערוך שיוך','data-detail="assetEdit:'+id+'"')+'</div>'+
   '<div class="details-panel">'+panel('פעילות שנקלטה',events.length?events.map(eventRow).join(''):'<p class="muted">הנכס מופיע במלאי. אין אירועי פעילות זמינים עבורו בדוגמה הזו.</p>')+'</div>';
 }
 if(kind==='event'){
  const {session,event,info}=eventInfo(id);
  return head(event[2],event[1]+' · '+assets[info.asset].n)+facts([['מזהה במקור',info.id],['זמן אירוע',info.at],['סביבה',info.env],['משך',info.duration??'לא דווח']])+
   panel('מה קרה ומה בודקים', '<p>'+info.cause+'</p><div class="trace">'+info.trace+'</div><h3>המשך בדוגמה</h3><p>'+info.next+'</p><div class="evidence">'+
   button('לנכס המדווח','data-detail="asset:'+info.asset+'"')+(info.connection===undefined?'':button('לחיבור המקור','data-detail="connection:'+info.connection+'"'))+
   (session?button('לסשן העבודה','data-session="'+session.id+'"'):'')+(info.related?button('לאירוע המקושר','data-detail="event:'+info.related+'"'):'')+'</div>');
 }
 const c=connections[Number(id)], [permission,scope,result]=connectorExtra[Number(id)];
 return head(c.n+' · '+c.scope,'פרטי חיבור וכיסוי הנתונים')+sourceLink(c.n,c.n==='GitHub'?'פתח ריפוזיטורי':'פתח לוח ספק')+facts([['מצב',c.status],['סנכרון אחרון',c.time],['הרשאות בדוגמה',permission],['כיסוי',scope]])+
 panel('סנכרון אחרון','<p>'+result+'</p>'+(state.note?'<div class="notice" role="status">'+state.note+'</div>':'')+button('הדגם סנכרון','data-sync="'+id+'"'))+
 '<div class="details-panel">'+panel('נכסים שמגיעים מהחיבור',assetRows(visibleAssets().filter(a=>assetExtra[assets.indexOf(a)][3]===id)))+'</div>';
}
function render(){
 const p=projectOf(state.project),s=sessions.find(item=>item.id===state.session);
 document.querySelectorAll('.nav').forEach(b=>{const selected=b.dataset.page===state.page;b.classList.toggle('active',selected);if(selected)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 let html='';
 if(state.detail)html=detailPage();
 else if(state.page==='costs')html=head('עלויות ושימוש','חיובים, הקצאות וצריכת טוקנים לפי פרויקט')+costsPage();
 else if(state.page==='agents')html=head('מרכז הסוכנים','סוכנים כלליים וסוכנים לפרויקט')+agentList();
 else if(state.page==='overview'){
  const cards=[['פרויקטים',visibleProjects().length,'projects'],['נכסים בקטלוג',visibleAssets().length,'assets'],['סשנים פתוחים',visibleSessions().filter(s=>s.status==='פתוח').length,'sessions','open'],['ממתינים לשיוך',visibleAssets().filter(a=>!a.p).length,'inbox']];
  html='<section class="hero"><div class="eyebrow">סביבת העבודה של לירון</div><h1>מרכז הבקרה</h1><p>הפרויקטים, סשני העבודה והאוטומציות שלך במקום אחד.</p></section><div class="guide"><span class="guide-label">בחר תרחיש להדגמה</span>'+ (active('comax')?button('למה פריסת השילוט נכשלה?','data-detail="event:s1:0"'):'')+(active('personal')?button('איך BuildFlow מחובר?','data-project="build"')+button('למה לא רואים ריצות בקליניקה?','data-detail="connection:4"'):'')+'</div><div class="grid">'+cards.map(([n,v,page,filter])=>'<button class="card" data-page="'+page+'" '+(filter?'data-filter="open"':'')+'>'+n+'<span class="num">'+v+'</span><small>פתח תצוגה ←</small></button>').join('')+'</div><div class="split">'+panel('הפרויקטים שלי',projectRows(visibleProjects()))+panel('דורש תשומת לב',visibleAssets().filter(a=>a.tone==='bad'||a.tone==='warn').map(a=>row(a.status,a.d,button('פתח פרטים','data-detail="'+(a===assets[1]?'event:s1:0':'asset:'+assets.indexOf(a))+'"'))).join(''))+'</div><div class="split">'+panel('סשנים אחרונים',sessionRows(visibleSessions()))+panel('חיבורים',row('עדכון אחרון להמחשה','הנתונים מוצגים לפי המרחב הנבחר',button('פתח חיבורים','data-page="connections"')))+'</div>';
 } else if(state.page==='projects'&&p){
  html=button('← לכל הפרויקטים','data-page="projects"')+head(p.name,p.desc)+'<div class="tabs">'+[['summary','סקירה'],['assets','נכסים'],['sessions','סשנים'],['tools','כלים ומפתחות'],['costs','עלויות'],['agents','סוכנים']].map(([id,n])=>button(n,'data-tab="'+id+'"',state.tab===id)).join('')+'</div>';
  if(state.tab==='summary')html+='<div class="guide">'+button('כלים ומפתחות','data-tab="tools"')+button('פירוט עלויות','data-tab="costs"')+button('סוכני הפרויקט','data-tab="agents"')+'</div>'+panel('מצב הפרויקט',row('סטטוס נוכחי',p.id==='sign'?'פריסת Preview נכשלה ב־11:42. גרסת הייצור נפרסה בהצלחה ב־10:21.':p.id==='build'?'גרסת הייצור נפרסה ב־09:32. נתוני מסד מופיעים תחת נכסים.':'ה־Workflow זוהה. נתוני ריצות ממתינים להרשאה.',pill(p.state,p.tone))+(p.id==='sign'?eventRow('s1:0')+eventRow('prod:0'):p.id==='build'?eventRow('build:0'):eventRow('s3:0')))+'<div class="split">'+panel('נכסים',assetRows(visibleAssets().filter(a=>a.p===p.id)))+panel('סשנים אחרונים',sessionRows(visibleSessions().filter(s=>s.p===p.id)))+'</div>';
  if(state.tab==='tools')html+='<p class="muted">בדמו הקישורים ל־Vercel ול־Supabase פותחים את לוח הספק.</p>'+officeConnections(p);
  if(state.tab==='costs')html+=costsPage(p.id);
  if(state.tab==='agents')html+=agentList(p.id);
  if(state.tab==='assets')html+=panel('נכסים בפרויקט',assetRows(visibleAssets().filter(a=>a.p===p.id)));
  if(state.tab==='sessions')html+=panel('סשנים בפרויקט',sessionRows(visibleSessions().filter(s=>s.p===p.id)));
 } else if(state.page==='sessions'&&s){
  html=button('← לפרויקט','data-project="'+s.p+'"')+' '+button('לכל הסשנים','data-page="sessions"')+head(s.n,projectOf(s.p).name+' · '+s.d)+'<div class="toolbar">'+pill(s.status)+pill(s.tool,'neutral')+button(s.status==='הושלם'?'פתח מחדש':'סמן כהושלם','data-toggle-session="'+s.id+'"')+'</div>'+panel('ציר הפעילות','<div class="timeline">'+s.events.map((_,i)=>eventRow(s.id+':'+i)).join('')+'</div>');
 } else if(state.page==='projects')html=head('פרויקטים','בחר פרויקט כדי לראות את נכסיו וסשני העבודה שלו.')+panel('כל הפרויקטים',projectRows(visibleProjects()));
 else if(state.page==='sessions')html=head('סשני עבודה','פרקי עבודה המקבצים פעולות ותוצרים מהכלים השונים.')+(state.filter==='open'?button('הצג את כל הסשנים','data-page="sessions"'):'')+panel(state.filter==='open'?'סשנים פתוחים':'כל הסשנים',sessionRows(visibleSessions().filter(item=>state.filter!=='open'||item.status==='פתוח')));
 else if(state.page==='assets')html=head('קטלוג נכסים','מה קיים, מה הוא עושה ואיפה הוא רץ.')+panel('נכסים לפי המרחב הנבחר',assetRows(visibleAssets()));
 else if(state.page==='connections')html=head('ניהול חיבורים','כיסוי, הרשאות ועדכניות לכל חשבון ומופע.')+(state.note?'<div class="notice" role="status">'+state.note+'</div>':'')+panel('חיבורים מוגדרים',connections.map((c,i)=>active(c.space)?row(c.n+' · '+c.scope,c.cap+' · סנכרון אחרון '+c.time,pill(c.status,c.tone)+' '+button('פרטי חיבור','data-detail="connection:'+i+'"')):'').join(''));
 else if(state.page==='inbox')html=head('תיבת מיון','כאן משייכים נכסים חדשים לפרויקטים.')+(state.note?'<div class="notice" role="status">'+state.note+'</div>':'')+panel('ממתינים לשיוך',visibleAssets().filter(a=>!a.p).map(a=>row('<bdi>'+a.n+'</bdi>',a.d+' · '+a.s,button('פרטי נכס','data-detail="asset:'+assets.indexOf(a)+'"')+' '+button('שייך לשילוט COMAX','data-assign'))).join(''));
 const locationLabel=state.detail?(state.detail.startsWith('event:')?'פרטי אירוע':state.detail.startsWith('asset:')?'פרטי נכס':'מסך פרטים'):s?.n??p?.name??names[state.page];
 el.innerHTML=(state.note&&state.detail&&!state.detail.startsWith('connection:')?'<div class="notice" role="status">'+state.note+'</div>':'')+(trail.length?'<nav class="crumbs" aria-label="מיקום">'+button('חזרה לתצוגה הקודמת','data-back')+' <span>'+names[state.page]+' / '+locationLabel+'</span></nav>':'')+html;
}
document.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;
 const d=b.dataset;
 if('back' in d){const previous=trail.pop();if(previous){Object.assign(state,previous.state);render();window.scrollTo(0,previous.scroll);}return;}
 if(d.page||d.project||d.session||d.detail){trail.push({state:{...state},scroll:window.scrollY});state.detail=null;state.filter=null;}
 state.note='';
 if(d.page){state.page=d.page;state.project=null;state.session=null;state.filter=d.filter??null;}
 else if(d.detail)state.detail=d.detail;
 else if(d.project){state.page='projects';state.project=d.project;state.session=null;state.tab='summary';}
 else if(d.session){state.page='sessions';state.session=d.session;}
 else if(d.tab){trail.push({state:{...state},scroll:window.scrollY});state.tab=d.tab;}
 else if(d.toggleSession){const s=sessions.find(s=>s.id===d.toggleSession);s.status=s.status==='הושלם'?'פתוח':'הושלם';}
 else if(d.sync!==undefined){const c=connections[Number(d.sync)];c.time=new Intl.DateTimeFormat('he-IL',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jerusalem'}).format(new Date());state.note=c.n+' · '+(c.tone?'סנכרון מלאי הודגם. הרשאת ריצות עדיין חסרה.':'הדגמת הסנכרון הסתיימה בהצלחה.');}
 else if('assign' in d){assets.find(a=>a.n==='catalog-digest').p='sign';state.note='הנכס שויך לשילוט COMAX ומופיע כעת בקטלוג הפרויקט.';}
 else return;
 render();if(d.page||d.project||d.session||d.detail)window.scrollTo(0,0);
});
el.addEventListener('submit',event=>{
 event.preventDefault();
 const form=event.target,{form:kind,id,space}=form.dataset,data=new FormData(form);
 state.note='';
 if(kind==='project'){
  const o=offices[id];o.key=Number(data.get('key'));o.budget=Number(data.get('budget'));o.links=data.getAll('links').map(Number);
  state.note='הגדרות הפרויקט נשמרו בדמו.';
 }else if(kind==='asset'){
  const a=assets[id];a.space=projectOf(a.p)?.space??a.space;a.p=data.get('project')||null;
  state.note='שיוך הנכס נשמר בדמו.';
 }else if(kind==='agent'){
  const agent={name:data.get('name').trim(),task:data.get('task').trim(),p:data.get('project'),key:Number(data.get('key')),space,enabled:data.has('enabled')};
  if(!agent.name||!agent.task){state.note='יש להזין שם והוראות משימה.';render();return;}
  if(id==='new'){agents.push(agent);state.detail='agent:'+(agents.length-1);}else agents[id]=agent;
  state.note='הגדרת הסוכן נשמרה בדמו.';
 }else if(kind==='run'){
  const a=agents[id],p=projectOf(data.get('project'));if(!a.enabled||!p||p.space!==a.space||(a.p&&a.p!==p.id))return;
  const input=1200,output=240,cost=0.02;
  runs.push({id:'run_office_'+(runs.length+1),name:a.name,p:p.id,key:a.key,status:'הושלם בדמו',input,output,cost,result:p.name+' · '+p.state+'. נאספו '+assets.filter(x=>x.p===p.id).length+' נכסים והופק סיכום מצב לדוגמה.'});
  charges.push({p:p.id,n:keys[a.key].name,type:'אומדן ריצת דמו',input,output,cost,key:a.key});
  trail.push({state:{...state},scroll:window.scrollY});state.detail='run:'+(runs.length-1);
 }
 render();
});
document.querySelector('#space').addEventListener('change',event=>{trail.length=0;state.detail=null;state.filter=null;state.space=event.target.value;state.project=null;state.session=null;state.note='';render();});
render();
</script></body></html>
